<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Optical File Transfer</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="container">

        <h1>QR Optical File Transfer</h1>

        <p class="subtitle">
            Sender
        </p>

        <section class="card">

            <h2>Select File</h2>

            <p class="description">
                Select a file to prepare for optical transmission.
            </p>

            <input type="file" id="fileInput">

            <div id="fileInfo" class="file-info hidden">

                <h3>Selected File</h3>

                <p>
                    <strong>Name:</strong>
                    <span id="fileName">-</span>
                </p>

                <p>
                    <strong>Type:</strong>
                    <span id="fileType">-</span>
                </p>

                <p>
                    <strong>Size:</strong>
                    <span id="fileSize">-</span>
                </p>
                <p>
                    <strong>Bytes loaded:</strong>
                    <span id="bytesLoaded">-</span>
                </p>

                <p>
                    <strong>Chunk size:</strong>
                    <span id="chunkSize">-</span>
                </p>
                
                <p>
                    <strong>Total chunks:</strong>
                    <span id="totalChunks">-</span>
                </p>

                <p>
                    <strong>Reconstructed bytes:</strong>
                    <span id="reconstructedBytes">-</span>
                </p>
                
                <p>
                    <strong>Chunk integrity:</strong>
                    <span id="chunkIntegrity">-</span>
                </p>

            </div>

        </section>

    </main>

    <script type="module" src="/js/app.js"></script>

</body>

</html>
